<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPot App</title>
    <!-- Official Telegram Web App JavaScript SDK Script Engine URL -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --spot-yellow: #FFDD00;
            --spot-danger: #ff4d4d;
            --spot-green: #25D366;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 16px 16px 90px 16px;
            box-sizing: border-box;
        }
        .header {
            background-color: var(--spot-yellow);
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
            color: #000;
        }
        /* Category Grid Layout */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }
        .category-btn {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .category-btn.active {
            background: var(--spot-yellow);
            border-color: #d4b200;
            color: #000;
        }
        .category-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }
        /* Navigation Views Switching Workspace */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        /* Feed Listings Cards */
        .catalog-feed {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 14px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        /* Publishing Form Styles */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        /* Fixed Bottom Navigation Setup */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #ddd;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 12px 0;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.05);
            z-index: 9999;
        }
        .nav-tab {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #777;
            cursor: pointer;
        }
        .nav-tab.active {
            color: #000;
            font-weight: bold;
        }
        .nav-tab-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <!-- App Brand Local Anchor Header Frame Profile -->
    <div class="header">Sungai Petani SPot</div>

    <!-- UTAMA WORKSPACE DASHBOARD VIEW -->
    <div id="viewUtama" class="view-section active">
        <!-- The 5 Category Grid Buttons Filter Controls -->
        <div class="category-grid">
            <div class="category-btn active" onclick="filterCategory('all', this)"><span class="category-icon">✨</span>All</div>
            <div class="category-btn" onclick="filterCategory('makan', this)"><span class="category-icon">🍱</span>Makan</div>
            <div class="category-btn" onclick="filterCategory('hasil_tani', this)"><span class="category-icon">🥬</span>Tani</div>
            <div class="category-btn" onclick="filterCategory('kebun_agro', this)"><span class="category-icon">🪴</span>Kebun</div>
            <div class="category-btn" onclick="filterCategory('pre_loved', this)"><span class="category-icon">📦</span>PreLoved</div>
        </div>

        <!-- Product Listing Grid Container Target Feed Anchor -->
        <div id="catalog" class="catalog-feed">Loading interactive catalog directory...</div>
    </div>

    <!-- LETAK IKLAN VENDOR PUBLISHING WORKSPACE VIEW -->
    <div id="viewLetakIklan" class="view-section">
        <h2 style="margin-top:0; font-size: 20px; margin-bottom: 16px;">Letak Iklan (30-Sec Fast Post)</h2>
        <div class="form-group">
            <label>Category</label>
            <select id="itemCategory">
                <option value="makan">🍱 Makan-Makan</option>
                <option value="hasil_tani">🥬 Hasil Tani</option>
                <option value="kebun_agro">🪴 Kebun & Agro</option>
                <option value="pre_loved">📦 Pre-Loved</option>
            </select>
        </div>
        <div class="form-group">
            <label>Item Name / Title</label>
            <input type="text" id="itemTitle" placeholder="e.g., Nasi Lemak Sambal Sotong Kedah">
        </div>
        <div class="form-group">
            <label>Fixed Locked Price (RM)</label>
            <input type="number" id="itemPrice" step="0.01" placeholder="0.00">
        </div>
        <button onclick="submitMockListing()" style="width:100%; padding:14px; background:var(--spot-yellow); border:none; font-weight:bold; border-radius:8px; font-size:16px; cursor:pointer; margin-top: 10px;">
            Publish Listing (Pins Current GPS)
        </button>
    </div>

    <!-- CORE BOTTOM NAVIGATION ANCHOR BAR FOOTER TABS -->
    <div class="bottom-nav">
        <button id="tabUtama" class="nav-tab active" onclick="switchTab('viewUtama', this)">
            <span class="nav-tab-icon">🏠</span>Utama
        </button>
        <button id="tabLetakIklan" class="nav-tab" onclick="switchTab('viewLetakIklan', this)">
            <span class="nav-tab-icon">➕</span>Letak Iklan
        </button>
        <button class="nav-tab" onclick="triggerAlert('Borak Jiran feature coming soon!')">
            <span class="nav-tab-icon">💬</span>Borak
        </button>
    </div>

    <script>
        // Extract native Telegram object wrapper configurations context instance cleanly
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        let currentCategoryFilter = 'all';

        // Local Memory State Cache Array Mock representation mapping your database structure rules
        let activeListings = [
            { id: '1', category: 'makan', title: 'Nasi Lemak Kak Ani Kukus', price: 3.50, distance: 0.4 },
            { id: '2', category: 'makan', title: 'Abang Burn Ramly Burger', price: 6.00, distance: 1.2 },
            { id: '3', category: 'pre_loved', title: 'Used Office Chair Mesh', price: 45.00, distance: 3.5 },
            { id: '4', category: 'hasil_tani', title: 'Fresh Morning Market Catch Mackerel', price: 12.00, distance: 2.1 }
        ];

        // Dynamic time shifted priority catalog sorting engine
        function getTimeShiftedPriority(item, currentHour) {
            if (item.category !== 'makan') return 0;
            if (currentHour >= 6 && currentHour < 11 && item.title.toLowerCase().includes('nasi lemak')) return 10;
            if (currentHour >= 16 && item.title.toLowerCase().includes('burger')) return 10;
            return 1;
        }

        function renderCatalog() {
            const catalogEl = document.getElementById('catalog');
            const currentHour = new Date().getHours();
            catalogEl.innerHTML = '';

            let targetListings = activeListings.map(item => {
                const priority = getTimeShiftedPriority(item, currentHour);
                return { ...item, priority };
            });

            // Apply active visual sub-category filter criteria
            if (currentCategoryFilter !== 'all') {
                targetListings = targetListings.filter(item => item.category === currentCategoryFilter);
            }

            if (targetListings.length === 0) {
                catalogEl.innerHTML = '<p style="text-align:center;color:#777;margin-top:20px;">No items found in this category.</p>';
                return;
            }

            // High priority custom listing sorting sequence rules
            targetListings.sort((a, b) => b.priority - a.priority || a.distance - b.distance);

            targetListings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3 style="margin:0 0 6px 0; font-size:16px;">${item.title}</h3>
                    <p style="margin:0 0 6px 0; font-size:15px;">Price: <strong style="color:#000;">RM${item.price.toFixed(2)}</strong></p>
                    <p style="font-size:12px; color:#666; margin:0 0 12px 0;">📍 Local Listing • ${item.distance.toFixed(1)} km away</p>
                    <button style="width:100%; padding:12px; background:var(--spot-green); border:none; color:white; font-weight:bold; border-radius:8px; cursor:pointer; font-size:14px;"
