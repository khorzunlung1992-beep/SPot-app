<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPot App</title>
    <!-- Imports the Official Telegram Web App JavaScript SDK Engine -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --spot-yellow: #FFDD00;
            --spot-danger: #ff4d4d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            background-color: var(--spot-yellow);
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
            color: #000;
        }
        .fallback-card {
            display: none;
            background: #fdf2f2;
            border: 1px solid var(--spot-danger);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .catalog-feed {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="header">Sungai Petani SPot</div>

    <!-- Out-of-Bounds Fallback Alert Box -->
    <div id="fallbackAlert" class="fallback-card">
        <strong>Terkeluar Kawasan (Out of Bounds)!</strong> You are currently over 10km away from Sungai Petani. Please pick an SP Hub route below to browse pre-orders:
        <br><br>
        <button onclick="overrideHub(5.6447, 100.5218)">Amanjaya Hub</button>
        <button onclick="overrideHub(5.6025, 100.5050)">Town Center Hub</button>
    </div>

    <!-- Live Product Directory Root -->
    <div id="catalog" class="catalog-feed">Loading localized deals...</div>

    <script>
        // Initialize the Telegram WebApp Core Interfaces
        const tg = window.Telegram.WebApp;
        tg.expand(); // Open to full height inside Telegram window instantly

        // Center Coordinate for SP Town Core Center Point
        const SP_CENTER = { latitude: 5.6447, longitude: 100.5218 };
        let buyerCoords = null;

        // Mock DB payload simulating your exact Supabase Relational Output
        const mockListingsFromSupabase = [
            { id: '1', category: 'makan', title: 'Nasi Lemak Kak Ani Kukus', price: 3.50, latitude: 5.6460, longitude: 100.5230, is_pre_order: false },
            { id: '2', category: 'makan', title: 'Abang Burn Ramly Burger', price: 6.00, latitude: 5.6410, longitude: 100.5180, is_pre_order: false },
            { id: '3', category: 'pre_loved', title: 'Used Office Chair Mesh', price: 45.00, latitude: 5.6590, longitude: 100.5400, is_pre_order: false }
        ];

        // 1. Straight-Line Haversine Calculation (Locking Bounds to 10.0km)
        function getHaversineDistance(c1, c2) {
            const R = 6371;
            const dLat = (c2.latitude - c1.latitude) * Math.PI / 180;
            const dLon = (c2.longitude - c1.longitude) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(c1.latitude * Math.PI / 180) * Math.cos(c2.latitude * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // 2. Client Time-Shift Priority Sorting Engine
        function getTimeShiftedPriority(item, currentHour) {
            if (item.category !== 'makan') return 0;
            // Breakfast priority rule (6 AM - 11 AM)
            if (currentHour >= 6 && currentHour < 11 && item.title.toLowerCase().includes('nasi lemak')) return 10;
            // Late afternoon burger/snack rule (4 PM onwards)
            if (currentHour >= 16 && item.title.toLowerCase().includes('burger')) return 10;
            return 1;
        }

        // 3. Render Directory Engine
        function renderCatalog(coords) {
            const catalogEl = document.getElementById('catalog');
            const currentHour = new Date().getHours();
            catalogEl.innerHTML = '';

            // Compute distance bounds instantly on client device runtime
            let targetListings = mockListingsFromSupabase.map(item => {
                const distance = getHaversineDistance(coords, { latitude: item.latitude, longitude: item.longitude });
                const priority = getTimeShiftedPriority(item, currentHour);
                return { ...item, distance, priority };
            });

            // Filter out-of-bounds listings strictly exceeding 10.0km limits
            const filteredListings = targetListings.filter(item => item.distance <= 10.0);

            // Handle Out-Of-Bounds Interface Trigger State
            if (filteredListings.length === 0) {
                document.getElementById('fallbackAlert').style.display = 'block';
                catalogEl.innerHTML = '<p style="text-align:center;">No direct neighborhood deals active within 10km.</p>';
                return;
            } else {
                document.getElementById('fallbackAlert').style.display = 'none';
            }

            // High priority pushes to top, secondary sort matches physical location closeness
            filteredListings.sort((a, b) => b.priority - a.priority || a.distance - b.distance);

            // Generate HTML markup strings dynamically
            filteredListings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>Price: <strong>RM${item.price.toFixed(2)}</strong></p>
                    <p style="font-size:12px; color:#666;">📍 Distance: ${item.distance.toFixed(1)} km away</p>
                    <button style="width:100%; padding:10px; background:#25D366; border:none; color:white; font-weight:bold; border-radius:8px;" 
                            onclick="triggerPurchase('${item.title}', ${item.price})">
                        Buy via WhatsApp Secure Zone
                    </button>
                `;
                catalogEl.appendChild(card);
            });
        }

        // 4. Fire Native Direct WhatsApp Deep Link
        function triggerPurchase(title, price) {
            const presetMeetup = "Petronas Amanjaya (Safe Zone)";
            const sellerPhone = "60123456789"; // Extracted via user relational profiles downstream
            const message = `Salam boss, I saw your listing for *${title}* (RM${price.toFixed(2)}) on the SPot app. Can we meet up at *${presetMeetup}*?`;
            
            // Fires out of the Telegram sandbox wrapper cleanly into native WhatsApp context
            window.location.href = `https://wa.me{sellerPhone}?text=${encodeURIComponent(message)}`;
        }

        // 5. Explicit Manual Location Switch Override Strategy
        function overrideHub(lat, lon) {
            buyerCoords = { latitude: lat, longitude: lon };
            renderCatalog(buyerCoords);
        }

        // Hardware Intercept Call: Load satellite position data natively
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                buyerCoords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                renderCatalog(buyerCoords);
            },
            (err) => {
                // If permission is denied or running inside a VPN without device GPS metrics, fallback safely to default node center
                console.warn("Hardware coordinates unavailable, defaulting to SP center.");
                buyerCoords = SP_CENTER;
                renderCatalog(buyerCoords);
            }
        );
    </script>
</body>
</html>
