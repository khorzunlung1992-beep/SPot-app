<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPot App</title>
    <!-- Official Telegram Mini App SDK -->
    <script src="https://telegram.org"></script>
    <!-- Tailwind CSS for Quick and Fast Layout Styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f9fafb);
            color: var(--tg-theme-text-color, #1f2937);
        }
    </style>
</head>
<body class="p-4 pb-24 select-none">

    <!-- HEADER BANNER -->
    <div class="bg-[#FFDD00] text-black font-extrabold text-center py-3.5 rounded-xl shadow-sm mb-4 tracking-wide text-md">
        ⚡ Sungai Petani SPot
    </div>

    <!-- MAIN HOME FEED (UTAMA VIEW) -->
    <div id="viewUtama" class="block">
        <!-- 5 Category Grid Selector Cards -->
        <div class="grid grid-cols-5 gap-1.5 mb-5">
            <button onclick="filterCategory('makan')" class="bg-white border border-gray-100 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center shadow-xs active:bg-gray-50">
                <span class="text-lg mb-1">🍱</span>Makan
            </button>
            <button onclick="filterCategory('hasil_tani')" class="bg-white border border-gray-100 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center shadow-xs active:bg-gray-50">
                <span class="text-lg mb-1">🥬</span>Tani
            </button>
            <button onclick="filterCategory('kebun_agro')" class="bg-white border border-gray-100 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center shadow-xs active:bg-gray-50">
                <span class="text-lg mb-1">🪴</span>Kebun
            </button>
            <button onclick="filterCategory('pre_loved')" class="bg-white border border-gray-100 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center shadow-xs active:bg-gray-50">
                <span class="text-lg mb-1">📦</span>PreLoved
            </button>
            <button onclick="filterCategory('jasa_jiran')" class="bg-white border border-gray-100 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center shadow-xs active:bg-gray-50">
                <span class="text-lg mb-1">🛠️</span>Jasa
            </button>
        </div>

        <!-- Real-Time Product Directory Feed Container -->
        <div id="catalogFeed" class="space-y-3">
            <!-- Items are injected here instantly via Javascript below -->
        </div>
    </div>

    <!-- PUBLISHING INTERFACE ENGINE (LETAK IKLAN VIEW) -->
    <div id="viewLetakIklan" class="hidden">
        <h2 class="text-lg font-black mb-4 tracking-tight flex items-center">➕ Kongsi Iklan Baru</h2>
        <div class="bg-amber-50 border border-amber-200 text-amber-900 p-3.5 rounded-xl text-xs mb-4 font-medium">
            💡 <strong>Sistem Tanpa Database:</strong> Memandangkan aplikasi ini berjalan terus dari Vercel tanpa server, iklan yang anda isi di bawah akan menjana pautan khas untuk terus dihantar ke group kejiranan WhatsApp / Telegram!
        </div>
        <form id="listingForm" onsubmit="generateShareLink(event)" class="space-y-4 bg-white p-4 rounded-xl border border-gray-100 shadow-xs">
            <div>
                <label class="block text-xs font-black uppercase text-gray-500 mb-1 tracking-wider">Pilih Kategori</label>
                <select id="formCategory" required class="w-full border border-gray-200 bg-gray-50 p-3 rounded-lg text-sm font-medium focus:outline-none focus:border-amber-400">
                    <option value="🍱 Makan-Makan">🍱 Makan-Makan (Gerai / Home Cooks)</option>
                    <option value="🥬 Hasil Tani">🥬 Hasil Tani (Kebun Rumah / Pasar Tani)</option>
                    <option value="🪴 Kebun & Agro">🪴 Kebun & Agro (Baja / Anak Pokok)</option>
                    <option value="📦 Pre-Loved">📦 Pre-Loved (Barang Terpakai)</option>
                    <option value="🛠️ Jasa Jiran">🛠️ Jasa Jiran (Potong Rumput / Runner)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black uppercase text-gray-500 mb-1 tracking-wider">Nama Produk / Jasa</label>
                <input type="text" id="formTitle" required placeholder="e.g., Nasi Lemak Ayam Berempah" class="w-full border border-gray-200 p-3 rounded-lg text-sm focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-xs font-black uppercase text-gray-500 mb-1 tracking-wider">Harga Tetap (RM)</label>
                <input type="number" step="0.01" id="formPrice" required placeholder="0.00" class="w-full border border-gray-200 p-3 rounded-lg text-sm focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-xs font-black uppercase text-gray-500 mb-1 tracking-wider">Nombor WhatsApp Anda (Mula dengan 60)</label>
                <input type="text" id="formPhone" required placeholder="e.g., 60123456789" class="w-full border border-gray-200 p-3 rounded-lg text-sm focus:outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full bg-[#FFDD00] text-black font-black py-3.5 rounded-lg text-sm shadow-xs active:scale-[0.99] transition-transform">
                🚀 Jana Pautan WhatsApp Jualan
            </button>
        </form>
    </div>

    <!-- IMMOBILE BOTTOM CORE NAVIGATION FOOTER -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 py-2.5 grid grid-cols-3 shadow-xl z-50">
        <button id="btnUtama" onclick="switchTab('viewUtama')" class="flex flex-col items-center text-[11px] font-black text-black">
            <span class="text-xl mb-0.5">🏠</span>Utama
        </button>
        <button id="btnLetakIklan" onclick="switchTab('viewLetakIklan')" class="flex flex-col items-center text-[11px] font-black text-gray-400">
            <span class="text-xl mb-0.5">➕</span>Letak Iklan
        </button>
        <button onclick="window.Telegram.WebApp.showAlert('Borak Jiran chat wall features coming soon!')" class="flex flex-col items-center text-[11px] font-black text-gray-400">
            <span class="text-xl mb-0.5">💬</span>Borak Jiran
        </button>
    </div>

    <!-- LIGHTWEIGHT DRIVER CONTROLLER SCRIPT (NO-DATABASE ENGINE) -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Localized Sample Data Storage array to run instantly out of Vercel memory
        const sampleListings = [
            { category: 'makan', title: 'Nasi Lemak Kak Ani Kukus Uthman', price: 3.50, phone: '60123456789', location: 'Petronas Amanjaya' },
            { category: 'makan', title: 'Crispy Burger Ramly Depan Lotus', price: 6.00, phone: '60176543210', location: 'Bakar Arang' },
            { category: 'hasil_tani', title: 'Pisang Awak Segar Kebun Belakang Rumah', price: 5.00, phone: '60198887766', location: 'Taman Puteri Jaya' },
            { category: 'kebun_agro', title: 'Baja Vermicompost Organik Gred A', price: 12.00, phone: '60134445566', location: 'Bandar Utama SP' },
            { category: 'pre_loved', title: 'Kipas Meja Khind 16 Inch (Condition 9/10)', price: 45.00, phone: '60112233445', location: 'Lagenda Height' },
            { category: 'jasa_jiran', title: 'Runner Mat Motor - Beli Barang Dapur & Keropok', price: 4.00, phone: '60159998887', location: 'Sungai Petani Area' }
        ];

        let activeCategoryFilter = null;

        // Visual Tab State Toggle function
        function switchTab(viewId) {
            document.getElementById('viewUtama').className = viewId === 'viewUtama' ? 'block' : 'hidden';
            document.getElementById('viewLetakIklan').className = viewId === 'viewLetakIklan' ? 'block' : 'hidden';
            
            document.getElementById('btnUtama').className = viewId === 'viewUtama' ? 'flex flex-col items-center text-[11px] font-black text-black' : 'flex flex-col items-center text-[11px] font-black text-gray-400';
            document.getElementById('btnLetakIklan').className = viewId === 'viewLetakIklan' ? 'flex flex-col items-center text-[11px] font-black text-black' : 'flex flex-col items-center text-[11px] font-black text-gray-400';
        }

        // Category Filter Management Logic
        function filterCategory(cat) {
            activeCategoryFilter = (activeCategoryFilter === cat) ? null : cat;
            renderFeed();
        }

        // Visual Feed Layout Generation Array Loop
        function renderFeed() {
            const feed = document.getElementById("catalogFeed");
            feed.innerHTML = "";

            const filteredData = activeCategoryFilter 
                ? sampleListings.filter(item => item.category === activeCategoryFilter)
                : sampleListings;

            if (filteredData.length === 0) {
                feed.innerHTML = "<p class='text-center text-gray-400 text-xs py-10'>Tiada iklan aktif buat masa sekarang.</p>";
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl border border-gray-100 shadow-xs relative flex flex-col justify-between";
                
                const encodedMsg = encodeURIComponent(`Salam boss, saya nampak produk "${item.title}" (RM${item.price.toFixed(2)}) dalam SPot App. Boleh deal kat ${item.location}?`);
                const waLink = `https://wa.me{item.phone}?text=${encodedMsg}`;

                card.innerHTML = `
                    <div>
